<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #17153b, #39245f, #102a43);
            color: white;
        }

        .page {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
            color: #f5d0fe;
        }

        .header p {
            margin: 0 auto;
            max-width: 650px;
            color: #ddd6fe;
            font-size: 15px;
            line-height: 1.5;
        }

        .report-card {
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.25);
            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #f3e8ff;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            font-size: 16px;
            outline: none;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.8);
        }

        .file-box {
            width: 100%;
            padding: 20px;
            border: 2px dashed rgba(216, 180, 254, 0.7);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
        }

        input[type="file"] {
            width: 100%;
            color: #f3e8ff;
        }

        .hint {
            display: block;
            margin-top: 10px;
            color: #c4b5fd;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(216, 180, 254, 0.65);
        }

        .logout-area {
            text-align: center;
            margin-top: 25px;
        }

        .logout {
            color: #ddd6fe;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            color: #f5d0fe;
        }

        /* Mobile screens */
        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            .header {
                margin-bottom: 25px;
            }

            .header-icon {
                font-size: 35px;
            }

            h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 14px;
            }

            .report-card {
                padding: 25px 20px;
                border-radius: 16px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            textarea {
                min-height: 120px;
            }

            .file-box {
                padding: 15px;
            }
        }

        /* Very small screens */
        @media (max-width: 350px) {

            body {
                padding: 15px 10px;
            }

            .report-card {
                padding: 20px 15px;
            }

            h1 {
                font-size: 21px;
            }

            input[type="text"],
            textarea,
            select,
            button {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="header">

            <div class="header-icon">
                Civic Reporter
            </div>

            <h1>Report a Civic Issue</h1>

            <p>
                Help make your community safer by reporting
                disasters, damages and public issues.
            </p>

        </div>


        <div class="report-card">

            <form action="/report" method="post" enctype="multipart/form-data">

                <div class="form-group">

                    <label for="title">
                        Issue Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Damaged Road"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the issue in detail..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="issue_type">
                        Issue Type
                    </label>

                    <select id="issue_type" name="issue_type">

                        <option value="Disaster">
                            Disaster
                        </option>

                        <option value="Manmade">
                            Manmade
                        </option>

                        <option value="Public Property">
                            Public Property
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter the issue location"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="image">
                        Upload Image
                    </label>

                    <div class="file-box">

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept="image/*"
                        >

                        <span class="hint">
                            Upload an image of the reported issue.
                        </span>

                    </div>

                </div>


                <button type="submit">
                    Submit Report
                </button>

            </form>

        </div>


        <div class="logout-area">

            <a href="/logout" class="logout">
                Logout
            </a>

        </div>

    </div>

</body>
</html>
