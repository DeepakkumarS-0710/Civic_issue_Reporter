
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Submitted</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #102a43, #243b53, #3c1361);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            width: 100%;
            max-width: 550px;
            padding: 45px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 45px rgba(100, 220, 255, 0.25);
            backdrop-filter: blur(12px);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #a7f3d0;
        }

        .message {
            margin: 25px 0;
            line-height: 1.6;
            font-size: 16px;
            color: #e0f2fe;
        }

        .status {
            width: 100%;
            padding: 15px;
            margin: 25px 0;
            border-radius: 10px;
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(167, 243, 208, 0.4);
            color: #a7f3d0;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            width: 50%;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            box-shadow: 0 0 18px rgba(236, 72, 153, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(167, 243, 208, 0.5);
        }

        .logout {
            background: linear-gradient(90deg, #475569, #334155);
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #cbd5e1;
        }

        /* Mobile screens */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .success-container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .icon {
                font-size: 45px;
            }

            h1 {
                font-size: 25px;
            }

            .message {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* Very small mobile screens */
        @media (max-width: 350px) {

            .success-container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 22px;
            }

            .message {
                font-size: 14px;
            }

            .status {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="icon">
            Success
        </div>

        <h1>Report Submitted!</h1>

        <p class="message">
            Your civic issue has been successfully submitted.
            Thank you for helping make your community safer and better.
        </p>

        <div class="status">
            Report received successfully
        </div>

        <div class="buttons">

            <a href="/report" class="btn">
                Submit Another
            </a>

            <a href="/logout" class="btn logout">
                Logout
            </a>

        </div>

        <div class="footer">
            Every report can make a difference.
        </div>

    </div>

</body>
</html>
