<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 380px;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }

        .role {
            margin-top: 10px;
            display: flex;
            gap: 20px;
        }

        .role label {
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Login or Auto Register</h2>

        <form method="POST" action="/login">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <br><br>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <br><br>

            <label>Select Role</label>

            <div class="role">
                <label>
                    <input type="radio" name="role" value="user" checked>
                    User
                </label>

                <label>
                    <input type="radio" name="role" value="admin">
                    Admin
                </label>
            </div>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
