<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Civic Issue Reporter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 5%;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #1b1b3a, #3d2b56, #16213e);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 8%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(180, 100, 255, 0.35);
            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
            color: #f5d0fe;
        }

        .subtitle {
            margin: 12px 0 25px;
            text-align: center;
            color: #ddd6fe;
            font-size: 15px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f3e8ff;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 4%;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 12px #d8b4fe;
        }

        .role-title {
            margin-bottom: 10px;
        }

        .roles {
            display: flex;
            justify-content: space-between;
            gap: 4%;
            margin-bottom: 25px;
        }

        .role-option {
            width: 50%;
            padding: 4%;
            text-align: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }

        .role-option:hover {
            background: rgba(216, 180, 254, 0.25);
        }

        .role-option input {
            margin-right: 6px;
        }

        button {
            width: 100%;
            padding: 4%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(216, 180, 254, 0.6);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #ddd6fe;
        }

        @media (max-width: 600px) {

            body {
                padding: 5%;
            }

            .login-container {
                width: 100%;
                padding: 8%;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 35px;
            }

            .subtitle {
                font-size: 14px;
            }

            .roles {
                flex-direction: column;
            }

            .role-option {
                width: 100%;
            }
        }

        @media (max-width: 350px) {

            h1 {
                font-size: 21px;
            }

            .login-container {
                padding: 7%;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">Civic Reporter</div>

        <h1>Civic Issue Reporter</h1>

        <p class="subtitle">
            Report disasters, damages and public issues in your area.
        </p>

        <form method="POST" action="/login">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <label class="role-title">Select Role</label>

            <div class="roles">

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="user"
                        checked
                    >
                    User
                </label>

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="admin"
                    >
                    Admin
                </label>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="footer">
            Together, let's make our community better.
        </div>

    </div>

</body>
</html>
